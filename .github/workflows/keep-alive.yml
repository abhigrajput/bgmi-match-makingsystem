# Keeps the free-tier Supabase project from auto-pausing.
#
# Supabase pauses free projects after a week without activity. On 2026-10-30 it
# did, and every sign-in failed (Task.md, Phase 1). This calls /api/health,
# which performs one cheap database read, every three days.
#
# Notes:
# - Scheduled workflows run only from the default branch, so this starts after
#   the PR merges. Run it by hand from the Actions tab to test it.
# - GitHub disables schedules in repos with no commits for 60 days. If that
#   happens, re-enable it from the Actions tab.
# - HEALTH_URL (repository variable) overrides the production URL, e.g. after
#   moving to a custom domain.
name: Keep alive

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: ${{ vars.HEALTH_URL || 'https://bgmi-match-makingsystem.vercel.app' }}
    steps:
      - name: Call /api/health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 30 "$HEALTH_URL/api/health" || true)
            echo "attempt $attempt: HTTP $code $(cat body.json 2>/dev/null)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::/api/health did not return 200. The Supabase project may be paused; restore it in the dashboard."
          exit 1
